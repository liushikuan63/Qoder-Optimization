name: release

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to verify and finish; never moved'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: |
            skills/office-docs/package-lock.json
            scripts/convention-runtime/package-lock.json

      - name: Install locked test dependencies
        run: |
          npm ci --prefix skills/office-docs --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/convention-runtime --ignore-scripts --no-audit --no-fund

      - name: Isolated self-tests and release contracts
        run: node .github/run-tests.js

      - name: Gate, build and independently verify the committed package
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="$(node -p "require('fs').readFileSync('VERSION', 'utf8').split(/\r?\n/)[0]")"
          REF="${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            TAG="${REQUESTED_TAG}"
            git show-ref --verify --quiet "refs/tags/${TAG}"
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/${TAG}^{commit}")" ]] || { echo "workflow_dispatch checkout ${GITHUB_SHA} differs from ${TAG}; refusing to publish"; exit 1; }
            REF="${TAG}"
          fi
          node .github/build-release.js "${TAG}" "${RUNNER_TEMP}/dist" "${REF}"

      - name: Verify skill reference integrity in the built package
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dist/build.json', 'utf8')).package")"
          node scripts/skill-reference-integrity.cjs --root "${RUNNER_TEMP}/dist/${PKG}" --check

      - name: Verify package contract
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dist/build.json', 'utf8')).package")"
          node scripts/share-package-verify.cjs "${RUNNER_TEMP}/dist/${PKG}"

      - name: Scan the actual distribution
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dist/build.json', 'utf8')).package")"
          node scripts/share-secret-scan.cjs "${RUNNER_TEMP}/dist/${PKG}"

      - name: Publish only after remote asset comparison
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dist/build.json', 'utf8')).tag")"
          node .github/publish-release.js "${TAG}" "${RUNNER_TEMP}/dist"

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: |
            skills/office-docs/package-lock.json
            scripts/convention-runtime/package-lock.json

      - name: Install locked test dependencies
        run: |
          npm ci --prefix skills/office-docs --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/convention-runtime --ignore-scripts --no-audit --no-fund

      - name: Isolated self-tests and release contracts
        run: node .github/run-tests.js

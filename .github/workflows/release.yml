name: release

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to verify and finish; never moved'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout event source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve source commit
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          REF="${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag"; exit 1; }
            git show-ref --verify --quiet "refs/tags/${REQUESTED_TAG}"
            REF="refs/tags/${REQUESTED_TAG}"
          fi
          COMMIT="$(git rev-parse --verify "${REF}^{commit}")"
          [[ "${COMMIT}" =~ ^[a-f0-9]{40}$ ]] || { echo "invalid source commit"; exit 1; }
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: [source, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.repository || github.run_id }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: |
            skills/office-docs/package-lock.json
            scripts/convention-runtime/package-lock.json

      - name: Verify frozen checkout
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: node -e "const cp=require('node:child_process');const actual=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(actual!==process.env.EXPECTED_COMMIT)throw new Error('checkout differs from frozen source commit');"

      - name: Install locked test dependencies
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
        run: |
          set -euo pipefail
          npm ci --prefix skills/office-docs --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/convention-runtime --ignore-scripts --no-audit --no-fund

      - name: Isolated self-tests and release contracts
        run: node .github/run-tests.js

      - name: Gate, build and independently verify the committed package
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          TAG="$(node -p "require('fs').readFileSync('VERSION', 'utf8').split(/\r?\n/)[0]")"
          REF="${SOURCE_COMMIT}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            TAG="${REQUESTED_TAG}"
            git show-ref --verify --quiet "refs/tags/${TAG}"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${SOURCE_COMMIT}" == "$(git rev-parse "refs/tags/${TAG}^{commit}")" ]] || { echo "tag differs from frozen source; refusing to publish"; exit 1; }
          fi
          node .github/build-release.js "${TAG}" "${RUNNER_TEMP}/dist" "${REF}"

      - name: Verify skill reference integrity in the built package
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dist/build.json', 'utf8')).package")"
          node scripts/skill-reference-integrity.cjs --root "${RUNNER_TEMP}/dist/${PKG}" --check

      - name: Verify package contract
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dist/build.json', 'utf8')).package")"
          node scripts/share-package-verify.cjs "${RUNNER_TEMP}/dist/${PKG}"

      - name: Scan the actual distribution
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dist/build.json', 'utf8')).package")"
          node scripts/share-secret-scan.cjs "${RUNNER_TEMP}/dist/${PKG}"

      - name: Publish only after remote asset comparison
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/dist/build.json', 'utf8')).tag")"
          node .github/publish-release.js "${TAG}" "${RUNNER_TEMP}/dist"

  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: |
            skills/office-docs/package-lock.json
            scripts/convention-runtime/package-lock.json

      - name: Verify frozen checkout
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: node -e "const cp=require('node:child_process');const actual=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(actual!==process.env.EXPECTED_COMMIT)throw new Error('checkout differs from frozen source commit');"

      - name: Install locked test dependencies
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
        run: |
          set -euo pipefail
          npm ci --prefix skills/office-docs --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/convention-runtime --ignore-scripts --no-audit --no-fund

      - name: Isolated self-tests and release contracts
        # Cua install fixtures require a non-system drive. GitHub's Windows
        # runner workspace/temp are on D:, unlike the default user TEMP on C:.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: node .github/run-tests.js
